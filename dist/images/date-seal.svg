<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#5a8a72"/>
      <stop offset="45%" stop-color="#2d5242"/>
      <stop offset="100%" stop-color="#163026"/>
    </radialGradient>
    <radialGradient id="waxShine" cx="35%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#e8d4a8"/>
      <stop offset="40%" stop-color="#c4a574"/>
      <stop offset="70%" stop-color="#a8844a"/>
      <stop offset="100%" stop-color="#d4b888"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0d1a14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Scalloped wax seal outline -->
  <g filter="url(#sealShadow)">
    <path
      fill="url(#wax)"
      d="M60 6
        C66 6 70 10 74 8 C79 5 84 8 86 13 C88 17 93 18 96 22
        C100 27 98 33 100 38 C102 43 106 46 106 52
        C106 58 102 61 100 66 C98 71 100 77 96 82
        C93 86 88 87 86 91 C84 96 79 99 74 96
        C70 94 66 98 60 98
        C54 98 50 94 46 96 C41 99 36 96 34 91
        C32 87 27 86 24 82 C20 77 22 71 20 66
        C18 61 14 58 14 52 C14 46 18 43 20 38
        C22 33 20 27 24 22 C27 18 32 17 34 13
        C36 8 41 5 46 8 C50 10 54 6 60 6Z"
    />
  </g>

  <circle cx="60" cy="52" r="38" fill="none" stroke="url(#goldRing)" stroke-width="2.4" opacity="0.95"/>
  <circle cx="60" cy="52" r="33.5" fill="none" stroke="#e8c4c0" stroke-width="1" opacity="0.55"/>

  <!-- Rope / bead inner ring -->
  <g fill="#d4b888" opacity="0.75">
    <circle cx="60" cy="21.5" r="1.35"/>
    <circle cx="72" cy="23.5" r="1.35"/>
    <circle cx="82" cy="30" r="1.35"/>
    <circle cx="89" cy="40" r="1.35"/>
    <circle cx="91.5" cy="52" r="1.35"/>
    <circle cx="89" cy="64" r="1.35"/>
    <circle cx="82" cy="74" r="1.35"/>
    <circle cx="72" cy="80.5" r="1.35"/>
    <circle cx="60" cy="82.5" r="1.35"/>
    <circle cx="48" cy="80.5" r="1.35"/>
    <circle cx="38" cy="74" r="1.35"/>
    <circle cx="31" cy="64" r="1.35"/>
    <circle cx="28.5" cy="52" r="1.35"/>
    <circle cx="31" cy="40" r="1.35"/>
    <circle cx="38" cy="30" r="1.35"/>
    <circle cx="48" cy="23.5" r="1.35"/>
  </g>

  <ellipse cx="48" cy="40" rx="22" ry="16" fill="url(#waxShine)"/>

  <!-- Tiny flourish -->
  <path
    d="M42 34 C48 30 54 30 60 34 C66 30 72 30 78 34"
    stroke="#d4b888"
    stroke-width="1.1"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />
</svg>
